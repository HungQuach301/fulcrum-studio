name: WP-002 Serialized Writer

on:
  workflow_dispatch:
    inputs:
      episodeId:
        description: Episode owning the files
        required: true
        type: string
      files:
        description: JSON array of path, file, mode, and schemaId
        required: true
        type: string
      writeId:
        description: Unique write ID supplied by the stage
        required: true
        type: string
      artifactRunId:
        description: Run that uploaded the artifact
        required: true
        type: string
      artifactName:
        description: Name of the uploaded artifact
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifactRunId }}
          name: ${{ inputs.artifactName }}
          path: ${{ runner.temp }}/episode-artifact
          github-token: ${{ github.token }}
      - name: Write episode files from the artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_ID: ${{ inputs.episodeId }}
          WRITE_FILES: ${{ inputs.files }}
          WRITE_ID: ${{ inputs.writeId }}
          ARTIFACT_PATH: ${{ runner.temp }}/episode-artifact
        run: npx tsx engine/io/github-writer.ts write
