          receipts=[];failed=False
          for name,args in commands:
           with (e/(name+'.stdout.txt')).open('wb') as out,(e/(name+'.stderr.txt')).open('wb') as err:
            r=subprocess.run(args,cwd=mirror,stdout=out,stderr=err,env=os.environ.copy())
           row={'name':name,'args':args,'cwd':str(mirror),'status':r.returncode}
