name: Fulcrum CI
run-name: ${{ inputs.request_id && format('FS24-D {0}', inputs.request_id) || github.event.head_commit.message || github.event.pull_request.title
  }}
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: fulcrum-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
env:
  FS_HEAD: ${{ inputs.expected_head || github.event.pull_request.head.sha || github.sha }}
  FS24_FINAL_CODE: ${{ inputs.code || '' }}
  FS24_FINAL_BATCH: ${{ inputs.batch || '' }}
  FS24_FINAL_REQUEST: ${{ inputs.request_id || '' }}
  FS_BRANCH: ${{ github.head_ref || github.ref_name }}
  FS_TITLE: ${{ github.event.pull_request.title || '' }}
  FS_EVENT: ${{ github.event_name }}
  GH_TOKEN: ${{ github.token }}
  FS_GRANT: FS24-D
  FS_CODE: ${{ inputs.code || '' }}
  FS24_FINAL_ORIGIN: ${{ inputs.origin || '' }}
  FS24_FINAL_ORDINAL: ${{ inputs.ordinal || '' }}
  FS_FINAL: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
jobs:
  validate:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    env:
      FS_JOB: validate
    outputs:
      summary: ${{ steps.evidence.outputs.summary }}
    steps:
    - name: Initialize evidence directory
      id: init
      shell: bash
      run: |
        set -euo pipefail
        task_root="$(mktemp -d "$RUNNER_TEMP/fs23-$FS_JOB.XXXXXX")"
        mkdir "$task_root/evidence"
        printf 'TASK_ROOT=%s
        FS_EVIDENCE=%s/evidence
        ' "$task_root" "$task_root" >> "$GITHUB_ENV"
    - name: Checkout exact candidate
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ env.FS_HEAD }}
        fetch-depth: 0
        persist-credentials: false
    - name: Preflight scope secret policy and checkpoint
      id: preflight
      shell: bash
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/wp002-preflight.py" runtime
    - name: Checksum-pinned runtime
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz -o "$TASK_ROOT/node.tar.xz"
        printf '%s  %s\n' df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d "$TASK_ROOT/node.tar.xz" | sha256sum -c -
        tar -xJf "$TASK_ROOT/node.tar.xz" -C "$TASK_ROOT"
        node_path="$TASK_ROOT/node-v20.20.2-linux-x64/bin/node"
        npm_cli="$TASK_ROOT/node-v20.20.2-linux-x64/lib/node_modules/npm/bin/npm-cli.js"
        test "$($node_path --version)" = v20.20.2
        test "$($node_path "$npm_cli" --version)" = 10.8.2
        printf 'FS_NODE=%s\nFS_NPM=%s\n' "$node_path" "$npm_cli" >> "$GITHUB_ENV"
        python3 - <<'PY'
        import os,json,pathlib
        pathlib.Path(os.environ['FS_EVIDENCE'],'runtime.json').write_text(json.dumps({'node':'20.20.2','npm':'10.8.2','archiveSha256':'df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d','archiveChecksum':'pass','node20EolException':'FS23-only','actionNode24Patch':'unproven','runnerOS':os.environ.get('RUNNER_OS'),'runnerArch':os.environ.get('RUNNER_ARCH'),'imageVersion':os.environ.get('ImageVersion'),'billedCostUsd':None,'B1B2':'unverified'})+'\n')
        PY
    - name: Set up action runtime tooling
      id: setup
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: Install exact lockfile without lifecycle scripts
      id: install
      shell: bash
      run: |
        set -euo pipefail
        mkdir "$TASK_ROOT/mirror"
        git archive "$FS_HEAD" | tar -x -C "$TASK_ROOT/mirror"
        printf 'FS_TSX=%s/mirror/node_modules/tsx/dist/cli.mjs\n' "$TASK_ROOT" >> "$GITHUB_ENV"
        export npm_config_cache="$TASK_ROOT/npm-cache"
        set +e
        "$FS_NODE" "$FS_NPM" ci --prefix "$TASK_ROOT/mirror" --ignore-scripts --no-audit --no-fund --include=dev --include=optional > "$FS_EVIDENCE/npm-ci.stdout.txt" 2> "$FS_EVIDENCE/npm-ci.stderr.txt"
        code=$?
        set -e
        printf '%s\n' "$code" > "$FS_EVIDENCE/npm-ci.exit.txt"
        exit "$code"
    - name: Run validate checks
      id: check
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,json,pathlib,subprocess,hashlib
        e=pathlib.Path(os.environ['FS_EVIDENCE']);mirror=pathlib.Path(os.environ['TASK_ROOT'],'mirror');node=os.environ['FS_NODE'];tsx=os.environ['FS_TSX'];root=os.environ['GITHUB_WORKSPACE'];head=os.environ['FS_HEAD'];base=os.environ['FS_BASE'];job=os.environ['FS_JOB']
        commands={'validate':[('validator',[node,tsx,'scripts/validate.ts','--root',root,'--commit',head])],'typecheck':[('typecheck',[node,str(mirror/'node_modules/typescript/bin/tsc'),'--noEmit'])],'guardrails':[('guardrails',[node,tsx,'scripts/guardrails/index.ts','--root',root,'--base',base,'--head',head,'--branch',os.environ['FS_BRANCH'],'--event',os.environ['FS_EVENT']]),('guardrails-tests',[node,tsx,'scripts/guardrails/guardrails.test.ts'])],'report':[('report',[node,tsx,'scripts/ci-report.ts'])]}[job]
        if job=='validate':
         for side in ['left','right']:
          episode='us-personal-finance/2026-09-fs24-'+side
          exists=subprocess.run(['git','-C',root,'cat-file','-e',head+':episodes/'+episode+'/state.json'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
          if exists:commands[0][1].extend(['--source',episode+'=bd7f0eb5b225ed43d610af12b5febbe82a7dbec4'])
        receipts=[];failed=False
        for name,args in commands:
         with (e/(name+'.stdout.txt')).open('wb') as out,(e/(name+'.stderr.txt')).open('wb') as err:
          r=subprocess.run(args,cwd=mirror,stdout=out,stderr=err,env=os.environ.copy())
         row={'name':name,'args':args,'cwd':str(mirror),'status':r.returncode}
         for stream in ['stdout','stderr']:
          data=(e/(name+'.'+stream+'.txt')).read_bytes();row[stream+'Bytes']=len(data);row[stream+'Sha256']=hashlib.sha256(data).hexdigest()
         receipts.append(row);failed|=r.returncode!=0
        if job=='guardrails':
         subprocess.run(['python3',str(pathlib.Path(root,'scripts/wp002-preflight.py')),'tests','--suite','guardrails'],check=True)
        (e/'commands.json').write_text(json.dumps(receipts,indent=2)+'\n')
        raise SystemExit(1 if failed else 0)
        PY
    - name: Verify source mirror and live main unchanged
      id: preservation
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/scripts/wp002-preflight.py" preserve
    - name: Remove temporary execution data
      id: cleanup
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,pathlib,shutil,json
        p=pathlib.Path(os.environ['TASK_ROOT']);assert p.parent==pathlib.Path(os.environ['RUNNER_TEMP']) and p.name.startswith('fs23-')
        for x in p.iterdir():
         if x.name=='evidence':continue
         if x.is_dir():shutil.rmtree(x)
         else:x.unlink()
        (p/'evidence/cleanup.json').write_text(json.dumps({'executionDataRemoved':True,'reportDataRemainingUntilFrame':True})+'\n')
        PY
    - name: Emit complete evidence bytes
      id: evidence
      if: ${{ always() }}
      shell: bash
      env:
        FS_STEPS: ${{ toJSON(steps) }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,pathlib,json,hashlib,base64,re
        p=pathlib.Path(os.environ['FS_EVIDENCE']);steps=json.loads(os.environ['FS_STEPS']);(p/'steps-at-emission.json').write_text(json.dumps(steps,indent=2)+'\n')
        required=['preflight','runtime','setup','install','check','preservation','cleanup'];ok=all(steps.get(s,{}).get('outcome')=='success' for s in required)
        errors=[]
        for f in sorted(p.glob('*.stderr.txt')):
         for line in f.read_text(errors='replace').splitlines():
          if line.strip():errors.append(line[:400])
        for f in sorted(p.glob('*.stdout.txt')):
         for line in f.read_text(errors='replace').splitlines():
          if re.search(r'error TS\d+|AssertionError|Error:',line):errors.append(line[:400])
        def redact(x):
         if re.search(r'\b(?:sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16})\b',x) or ('PRIVATE'+' KEY') in x:return '[redacted]'
         if any(not re.fullmatch('[a-fA-F0-9]+',v) for v in re.findall(r'[A-Za-z0-9+/]{80,}={0,2}',x)):return '[redacted]'
         return x
        summary={'head':os.environ['FS_HEAD'],'base':os.environ.get('FS_BASE',''),'job':os.environ['FS_JOB'],'result':'success' if ok else 'failure','errors':[redact(x) for x in errors[:20]],'finalJobStatus':'requires-API-readback'}
        (p/'job-summary.json').write_text(json.dumps(summary,ensure_ascii=False)+'\n')
        with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('summary='+json.dumps(summary,ensure_ascii=True)+'\n')
        identity=['FS23-WP001',os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'],os.environ['FS_HEAD'],os.environ['FS_JOB'],os.environ['FS_EVENT'],os.environ.get('FS_BASE','')]
        if os.environ.get('FS_EVIDENCE_MODE')=='bundle-v1':
         import subprocess
         target=pathlib.Path(os.environ['TASK_ROOT'],'evidence-bundle.zip')
         subprocess.run(['python3',str(pathlib.Path(os.environ['GITHUB_WORKSPACE'],'engine/io/evidence-transfer.py')),'pack','--directory',str(p),'--file',str(target)],check=True)
         raise SystemExit(0 if ok else 1)
        print('FS23_BEGIN\t'+'\t'.join(identity))
        files=sorted(p.iterdir())
        for f in files:
         assert f.is_file() and re.fullmatch('[A-Za-z0-9_.-]+',f.name)
         data=f.read_bytes();name=base64.b64encode(f.name.encode()).decode();print('FS23_FILE\t'+name+'\t'+str(len(data))+'\t'+hashlib.sha256(data).hexdigest());value=base64.b64encode(data).decode()
         for i in range(0,len(value),2048):print('FS23_DATA\t'+str(i//2048+1)+'\t'+value[i:i+2048])
         print('FS23_END\t'+name)
        print('FS23_COMPLETE\t'+str(len(files)))
        PY
    - name: Preserve original evidence bundle
      id: evidence_bundle
      if: ${{ always() && env.FS_EVIDENCE_MODE == 'bundle-v1' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fs24e-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.FS_JOB }}
        path: ${{ env.TASK_ROOT }}/evidence-bundle.zip
        retention-days: 7
        compression-level: 0
        if-no-files-found: error
    - name: Remove final report data
      id: final_cleanup
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        case "$TASK_ROOT" in "$RUNNER_TEMP"/fs23-*) rm -rf -- "$TASK_ROOT" ;; *) exit 1 ;; esac
        test ! -e "$TASK_ROOT"
        printf 'FS23_FINAL_REPORT_CLEANUP=pass;job=%s\n' "$FS_JOB"
