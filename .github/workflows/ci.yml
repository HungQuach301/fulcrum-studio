name: Fulcrum CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  CI_BRANCH: ${{ github.head_ref || github.ref_name }}
  CI_TITLE: ${{ github.event.pull_request.title || '' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CI_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: check
        env:
          CI_JOB: validate
        run: |
          set +e
          npx tsx scripts/validate.ts 2>&1 | tee "$RUNNER_TEMP/$CI_JOB.log"
          code=${PIPESTATUS[0]}
          set -e
          STATUS=$([ "$code" -eq 0 ] && echo success || echo failure) LOG="$RUNNER_TEMP/$CI_JOB.log" node -e 'const fs=require("fs");const errors=process.env.STATUS==="failure"?fs.readFileSync(process.env.LOG,"utf8").split(/\r?\n/).filter(Boolean).slice(-20):[];process.stdout.write("summary="+JSON.stringify({head:process.env.CI_HEAD,base:process.env.CI_BASE,job:process.env.CI_JOB,result:process.env.STATUS,errors})+"\n")' >> "$GITHUB_OUTPUT"
          exit "$code"

  typecheck:
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CI_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: check
        env:
          CI_JOB: typecheck
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/$CI_JOB.log"
          code=${PIPESTATUS[0]}
          set -e
          STATUS=$([ "$code" -eq 0 ] && echo success || echo failure) LOG="$RUNNER_TEMP/$CI_JOB.log" node -e 'const fs=require("fs");const errors=process.env.STATUS==="failure"?fs.readFileSync(process.env.LOG,"utf8").split(/\r?\n/).filter(Boolean).slice(-20):[];process.stdout.write("summary="+JSON.stringify({head:process.env.CI_HEAD,base:process.env.CI_BASE,job:process.env.CI_JOB,result:process.env.STATUS,errors})+"\n")' >> "$GITHUB_OUTPUT"
          exit "$code"

  guardrails:
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.check.outputs.summary }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CI_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: check
        env:
          CI_JOB: guardrails
          FS_TITLE: ${{ env.CI_TITLE }}
        run: |
          set +e
          npx tsx scripts/guardrails/index.ts --root "$GITHUB_WORKSPACE" --base "$CI_BASE" --head "$CI_HEAD" --branch "$CI_BRANCH" --event "$GITHUB_EVENT_NAME" 2>&1 | tee "$RUNNER_TEMP/$CI_JOB.log"
          code=${PIPESTATUS[0]}
          set -e
          STATUS=$([ "$code" -eq 0 ] && echo success || echo failure) LOG="$RUNNER_TEMP/$CI_JOB.log" node -e 'const fs=require("fs");const errors=process.env.STATUS==="failure"?fs.readFileSync(process.env.LOG,"utf8").split(/\r?\n/).filter(Boolean).slice(-20):[];process.stdout.write("summary="+JSON.stringify({head:process.env.CI_HEAD,base:process.env.CI_BASE,job:process.env.CI_JOB,result:process.env.STATUS,errors})+"\n")' >> "$GITHUB_OUTPUT"
          exit "$code"

  report:
    if: always()
    needs: [validate, typecheck, guardrails]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CI_HEAD }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build report
        env:
          FS_HEAD: ${{ env.CI_HEAD }}
          FS_BASE: ${{ env.CI_BASE }}
          FS_NEEDS: ${{ toJSON(needs) }}
          FS_EVIDENCE: ${{ runner.temp }}/ci-report
        run: |
          mkdir -p "$FS_EVIDENCE"
          npx tsx scripts/ci-report.ts
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-report-${{ env.CI_HEAD }}
          path: ${{ runner.temp }}/ci-report/ci-report.txt
          if-no-files-found: error
          retention-days: 7
