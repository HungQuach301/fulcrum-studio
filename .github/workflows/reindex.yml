name: WP-002 Reindex

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: reindex
  cancel-in-progress: true

jobs:
  reindex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild the index from episode states on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx engine/io/github-writer.ts reindex
