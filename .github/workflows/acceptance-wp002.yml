name: WP-002 Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp002a-interfaces:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run three WP-002a acceptance tests
        run: |
          npx tsx engine/io/repo-store.test.ts
          npx tsx engine/providers/registry.test.ts

  wp002b-write-queue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run six WP-002b acceptance tests
        run: npx tsx engine/io/repo-store.test.ts
