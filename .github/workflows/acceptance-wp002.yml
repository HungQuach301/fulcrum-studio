name: WP-002 Foundation Acceptance
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: fs24-foundation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
env:
  FS_HEAD: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  FS_BRANCH: ${{ github.head_ref || github.ref_name }}
  FS_TITLE: ${{ github.event.pull_request.title || '' }}
  FS_EVENT: ${{ github.event_name }}
  GH_TOKEN: ${{ github.token }}
  FS_GRANT: FS24-B-R1
jobs:
  foundation:
    if: ${{ !github.event.deleted && (github.event_name == 'push' || (github.head_ref == 'wp/002' && github.event.pull_request.head.repo.full_name
      == github.repository)) }}
    runs-on: ubuntu-24.04
    env:
      FS_JOB: foundation
    outputs:
      summary: ${{ steps.evidence.outputs.summary }}
    steps:
    - name: Initialize evidence directory
      id: init
      shell: bash
      run: |
        set -euo pipefail
        task_root="$(mktemp -d "$RUNNER_TEMP/fs24-$FS_JOB.XXXXXX")"
        mkdir "$task_root/evidence"
        printf 'TASK_ROOT=%s
        FS_EVIDENCE=%s/evidence
        ' "$task_root" "$task_root" >> "$GITHUB_ENV"
    - name: Checkout exact candidate
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ env.FS_HEAD }}
        fetch-depth: 0
        persist-credentials: false
    - name: Preflight scope secret policy and checkpoint
      id: preflight
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,json,subprocess,pathlib,hashlib,re,urllib.request
        root=pathlib.Path(os.environ['GITHUB_WORKSPACE']); evidence=pathlib.Path(os.environ['FS_EVIDENCE'])
        def git(*args):return subprocess.check_output(['git','-C',str(root),*args]).decode()
        head=os.environ['FS_HEAD'];branch=os.environ['FS_BRANCH'];event=os.environ['FS_EVENT']
        assert os.environ['GITHUB_REPOSITORY']=='HungQuach301/fulcrum-studio'
        assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
        assert re.fullmatch('[a-f0-9]{40}',head) and git('rev-parse','HEAD').strip()==head
        request=urllib.request.Request('https://api.github.com/repos/HungQuach301/fulcrum-studio/git/ref/heads/main',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
        with urllib.request.urlopen(request) as response:raw=response.read()
        (evidence/'main-ref.before.json').write_bytes(raw);main=json.loads(raw)['object']['sha']
        base=git('rev-parse',head+'^1').strip() if branch=='main' and event=='push' else main
        with open(os.environ['GITHUB_ENV'],'a') as f:f.write('FS_BASE='+base+'\n')
        assert main=='83786225fdaff2fcbc82cd2b99212a905dd19ceb' and base==main,'main-checkpoint'
        assert branch=='wp/002' and event in ['push','pull_request'],'branch-event'
        diff=git('diff','--no-renames','--name-only','-z',base,head).split('\0')[:-1]


        r1={'base': '83786225fdaff2fcbc82cd2b99212a905dd19ceb', 'tree': 'dc59bf4b8e470fa23a042acd4bf19f909dca5e0c', 'historicalHead': '19bb30568885ef6cb2c7c4b3c8cb9053f9b1fe21', 'files': {'engine/docs/02-decisions.md': 'b15222c348c84af3dbc2f2fccb3eecd4ce89141e', 'engine/ops/work-packages/WP-002-interfaces.md': '6d716a54271dd00e5eaa219acf7ee94712c48ee7'}, 'paths': ['engine/docs/02-decisions.md', 'engine/ops/work-packages/WP-002-interfaces.md', '.github/workflows/ci.yml', 'scripts/guardrails/index.ts', '.github/workflows/acceptance-wp002.yml', 'engine/io/github-transport.ts', 'engine/io/github-writer.ts', 'engine/io/wp002-integration.test.ts', 'engine/io/wp002-integration.ts']}
        def verify_r1(candidate):
         assert git('rev-parse',r1['base']+'^{tree}').strip()==r1['tree'],'R1-base-tree'
         git('merge-base','--is-ancestor',r1['base'],candidate)
         chain=git('rev-list','--reverse',r1['base']+'..'+candidate).splitlines();assert 2<=len(chain)<=4,'R1-count'
         previous=r1['base']
         for i,sha in enumerate(chain):
          assert git('rev-list','--parents','-n','1',sha).strip()==sha+' '+previous,'R1-parent'
          msg=git('show','-s','--format=%B',sha)
          for k,v in [('Grant','FS24-B-R1'),('Phase','policy' if i==0 else 'implementation')]+([] if i==0 else [('Iteration',str(i))]):assert re.findall(r'^Fulcrum-'+k+': (.*)$',msg,re.M)==[v],'R1-trailer'
          changed=set(git('diff','--name-only',previous,sha).splitlines())
          assert changed==set(r1['files']) if i==0 else changed<=set(r1['paths'][2:]),'R1-scope'
          previous=sha
         for path,pin in r1['files'].items():
          assert git('rev-parse',chain[0]+':'+path).strip()==pin and git('rev-parse',candidate+':'+path).strip()==pin,'R1-policy-freeze'
          assert git('show',chain[0]+':'+path).startswith(git('show',r1['base']+':'+path)),'R1-prefix'
         assert set(git('diff','--name-only',r1['base'],candidate).splitlines())<=set(r1['paths'])
         for path in git('ls-tree','-r','--name-only',r1['base']).splitlines():
          if path not in r1['paths']:assert git('ls-tree',r1['base'],'--',path)==git('ls-tree',candidate,'--',path),('R1-preservation',path)

        verify_r1(head)
        fs24b=r1['paths']
        for path in diff:
         assert not path.startswith('/') and not any(x in ['..','.',''] for x in path.split('/')) and '\\' not in path
         patch=git('diff','--no-ext-diff','--unified=0',base,head,'--',path)
         for line in patch.splitlines():
          if not line.startswith('+') or line.startswith('+++'):continue
          value=line[1:]
          assert not re.search(r'\b(?:sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16})\b',value),('secret-redacted',path)
          assert ('PRIVATE'+' KEY') not in value,('private-key-redacted',path)
          assert all(re.fullmatch('[a-fA-F0-9]+',x) for x in re.findall(r'[A-Za-z0-9+/]{80,}={0,2}',value)),('base64-redacted',path)
        names=git('ls-files','-z').split('\0')[:-1]
        assert not git('status','--porcelain=v1','--untracked-files=all').strip()
        snapshot={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in names}
        (evidence/'source.before.json').write_text(json.dumps(snapshot,sort_keys=True)+'\n')
        (evidence/'preflight.json').write_text(json.dumps({'result':'pass','head':head,'base':base,'branch':branch,'event':event,'eventSha':os.environ['GITHUB_SHA'],'grant':'FS24-B-R1','repository':os.environ['GITHUB_REPOSITORY'],'policy':None,'paths':diff,'sourceFiles':len(names)})+'\n')
        PY
    - name: Checksum-pinned runtime
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz -o "$TASK_ROOT/node.tar.xz"
        printf '%s  %s\n' df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d "$TASK_ROOT/node.tar.xz" | sha256sum -c -
        tar -xJf "$TASK_ROOT/node.tar.xz" -C "$TASK_ROOT"
        node_path="$TASK_ROOT/node-v20.20.2-linux-x64/bin/node"
        npm_cli="$TASK_ROOT/node-v20.20.2-linux-x64/lib/node_modules/npm/bin/npm-cli.js"
        test "$($node_path --version)" = v20.20.2
        test "$($node_path "$npm_cli" --version)" = 10.8.2
        printf 'FS_NODE=%s\nFS_NPM=%s\n' "$node_path" "$npm_cli" >> "$GITHUB_ENV"
        python3 - <<'PY'
        import os,json,pathlib
        pathlib.Path(os.environ['FS_EVIDENCE'],'runtime.json').write_text(json.dumps({'node':'20.20.2','npm':'10.8.2','archiveSha256':'df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d','archiveChecksum':'pass','node20EolException':'FS24-B-only','actionNode24Patch':'unproven','runnerOS':os.environ.get('RUNNER_OS'),'runnerArch':os.environ.get('RUNNER_ARCH'),'imageVersion':os.environ.get('ImageVersion'),'billedCostUsd':None,'B1B2':'unverified'})+'\n')
        PY
    - name: Set up action runtime tooling
      id: setup
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: Install exact lockfile without lifecycle scripts
      id: install
      shell: bash
      run: |
        set -euo pipefail
        mkdir "$TASK_ROOT/mirror"
        git archive "$FS_HEAD" | tar -x -C "$TASK_ROOT/mirror"
        printf 'FS_TSX=%s/mirror/node_modules/tsx/dist/cli.mjs\n' "$TASK_ROOT" >> "$GITHUB_ENV"
        export npm_config_cache="$TASK_ROOT/npm-cache"
        set +e
        "$FS_NODE" "$FS_NPM" ci --prefix "$TASK_ROOT/mirror" --ignore-scripts --no-audit --no-fund --include=dev --include=optional > "$FS_EVIDENCE/npm-ci.stdout.txt" 2> "$FS_EVIDENCE/npm-ci.stderr.txt"
        code=$?
        set -e
        printf '%s\n' "$code" > "$FS_EVIDENCE/npm-ci.exit.txt"
        exit "$code"
    - name: Run foundation model and registry checks
      id: check
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,json,pathlib,subprocess,hashlib
        e=pathlib.Path(os.environ['FS_EVIDENCE']);mirror=pathlib.Path(os.environ['TASK_ROOT'],'mirror');node=os.environ['FS_NODE'];tsx=os.environ['FS_TSX'];root=os.environ['GITHUB_WORKSPACE'];head=os.environ['FS_HEAD'];base=os.environ['FS_BASE'];job=os.environ['FS_JOB']
        commands=[('repo-store-tests',[node,tsx,'engine/io/repo-store.test.ts']),('registry-tests',[node,tsx,'engine/providers/registry.test.ts']),('integration-tests',[node,tsx,'engine/io/wp002-integration.test.ts'])]
        receipts=[];failed=False
        for name,args in commands:
         with (e/(name+'.stdout.txt')).open('wb') as out,(e/(name+'.stderr.txt')).open('wb') as err:
          r=subprocess.run(args,cwd=mirror,stdout=out,stderr=err,env=os.environ.copy())
         row={'name':name,'args':args,'cwd':str(mirror),'status':r.returncode}
         for stream in ['stdout','stderr']:
          data=(e/(name+'.'+stream+'.txt')).read_bytes();row[stream+'Bytes']=len(data);row[stream+'Sha256']=hashlib.sha256(data).hexdigest()
         receipts.append(row);failed|=r.returncode!=0
        (e/'commands.json').write_text(json.dumps(receipts,indent=2)+'\n')
        raise SystemExit(1 if failed else 0)
        PY
    - name: Diagnose historical merge receipt without writes
      id: diagnostic
      shell: bash
      run: |
        set -euo pipefail
        cd "$TASK_ROOT/mirror"
        "$FS_NODE" "$FS_TSX" engine/io/wp002-integration.ts diagnose-history
    - name: Verify source mirror and live main unchanged
      id: preservation
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,pathlib,json,hashlib,subprocess,urllib.request
        e=pathlib.Path(os.environ['FS_EVIDENCE']);root=pathlib.Path(os.environ['GITHUB_WORKSPACE']);mirror=pathlib.Path(os.environ['TASK_ROOT'],'mirror')
        before=json.loads((e/'source.before.json').read_text());after={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in before}
        (e/'source.after.json').write_text(json.dumps(after,sort_keys=True)+'\n');assert before==after
        if mirror.exists():assert all(hashlib.sha256((mirror/p).read_bytes()).hexdigest()==v for p,v in before.items())
        assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==os.environ['FS_HEAD']
        assert not subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all']).strip()
        request=urllib.request.Request('https://api.github.com/repos/HungQuach301/fulcrum-studio/git/ref/heads/main',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
        with urllib.request.urlopen(request) as response:raw=response.read()
        (e/'main-ref.after.json').write_bytes(raw);assert json.loads(raw)['object']['sha']==json.loads((e/'main-ref.before.json').read_text())['object']['sha']
        (e/'preservation.json').write_text(json.dumps({'result':'pass','sourceUnchanged':True,'mirrorUnchanged':mirror.exists(),'mainUnchanged':True,'sourceFiles':len(before),'stateAndDependencyBytesUnchanged':True})+'\n')
        PY
    - name: Remove temporary execution data
      id: cleanup
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,pathlib,shutil,json
        p=pathlib.Path(os.environ['TASK_ROOT']);assert p.parent==pathlib.Path(os.environ['RUNNER_TEMP']) and p.name.startswith('fs24-')
        for x in p.iterdir():
         if x.name=='evidence':continue
         if x.is_dir():shutil.rmtree(x)
         else:x.unlink()
        (p/'evidence/cleanup.json').write_text(json.dumps({'executionDataRemoved':True,'reportDataRemainingUntilFrame':True})+'\n')
        PY
    - name: Emit complete evidence bytes
      id: evidence
      if: ${{ always() }}
      shell: bash
      env:
        FS_STEPS: ${{ toJSON(steps) }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,pathlib,json,hashlib,base64,re
        p=pathlib.Path(os.environ['FS_EVIDENCE']);steps=json.loads(os.environ['FS_STEPS']);(p/'steps-at-emission.json').write_text(json.dumps(steps,indent=2)+'\n')
        # FS24R1_REQUIRED_BEGIN
        required=['preflight','runtime','setup','install','check','diagnostic','preservation','cleanup']
        ok=all(steps.get(s,{}).get('outcome')=='success' for s in required)
        # FS24R1_REQUIRED_END
        errors=[]
        for f in sorted(p.glob('*.stderr.txt')):
         for line in f.read_text(errors='replace').splitlines():
          if line.strip():errors.append(line[:400])
        for f in sorted(p.glob('*.stdout.txt')):
         for line in f.read_text(errors='replace').splitlines():
          if re.search(r'error TS\d+|AssertionError|Error:',line):errors.append(line[:400])
        def redact(x):
         if re.search(r'\b(?:sk-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16})\b',x) or ('PRIVATE'+' KEY') in x:return '[redacted]'
         if any(not re.fullmatch('[a-fA-F0-9]+',v) for v in re.findall(r'[A-Za-z0-9+/]{80,}={0,2}',x)):return '[redacted]'
         return x
        summary={'head':os.environ['FS_HEAD'],'base':os.environ.get('FS_BASE',''),'job':os.environ['FS_JOB'],'result':'success' if ok else 'failure','errors':[redact(x) for x in errors[:20]],'finalJobStatus':'requires-API-readback'}
        (p/'job-summary.json').write_text(json.dumps(summary,ensure_ascii=False)+'\n')
        with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('summary='+json.dumps(summary,ensure_ascii=True)+'\n')
        identity=['FS24-A',os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'],os.environ['FS_HEAD'],os.environ['FS_JOB'],os.environ['FS_EVENT'],os.environ.get('FS_BASE','')]
        print('FS24_BEGIN\t'+'\t'.join(identity))
        files=sorted(p.iterdir())
        for f in files:
         assert f.is_file() and re.fullmatch('[A-Za-z0-9_.-]+',f.name)
         data=f.read_bytes();name=base64.b64encode(f.name.encode()).decode();print('FS24_FILE\t'+name+'\t'+str(len(data))+'\t'+hashlib.sha256(data).hexdigest());value=base64.b64encode(data).decode()
         for i in range(0,len(value),2048):print('FS24_DATA\t'+str(i//2048+1)+'\t'+value[i:i+2048])
         print('FS24_END\t'+name)
        print('FS24_COMPLETE\t'+str(len(files)))
        raise SystemExit(0 if ok else 1)
        PY
    - name: Remove final report data
      id: final_cleanup
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        case "$TASK_ROOT" in "$RUNNER_TEMP"/fs24-*) rm -rf -- "$TASK_ROOT" ;; *) exit 1 ;; esac
        test ! -e "$TASK_ROOT"
        printf 'FS24_FINAL_REPORT_CLEANUP=pass;job=%s\n' "$FS_JOB"
  diagnostic:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      FS_JOB: diagnostic
    steps:
    - name: Initialize bounded work directory
      shell: bash
      run: |
        set -euo pipefail
        task_root="$(mktemp -d "$RUNNER_TEMP/fs24r1.XXXXXX")"
        mkdir "$task_root/evidence"
        printf "TASK_ROOT=%s\nFS_EVIDENCE=%s/evidence\n" "$task_root" "$task_root" >> "$GITHUB_ENV"
    - name: Checkout approved immutable code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ env.FS_HEAD }}
        fetch-depth: 0
        persist-credentials: false
    - name: Read-only admission before project execution
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,json,re,subprocess,pathlib,hashlib,urllib.request
        def git(*args):return subprocess.check_output(['git',*args]).decode()
        head=os.environ['FS_HEAD']
        assert os.environ['GITHUB_REPOSITORY']=='HungQuach301/fulcrum-studio' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
        assert re.fullmatch('[a-f0-9]{40}',head) and git('rev-parse','HEAD').strip()==head

        r1={'base': '83786225fdaff2fcbc82cd2b99212a905dd19ceb', 'tree': 'dc59bf4b8e470fa23a042acd4bf19f909dca5e0c', 'historicalHead': '19bb30568885ef6cb2c7c4b3c8cb9053f9b1fe21', 'files': {'engine/docs/02-decisions.md': 'b15222c348c84af3dbc2f2fccb3eecd4ce89141e', 'engine/ops/work-packages/WP-002-interfaces.md': '6d716a54271dd00e5eaa219acf7ee94712c48ee7'}, 'paths': ['engine/docs/02-decisions.md', 'engine/ops/work-packages/WP-002-interfaces.md', '.github/workflows/ci.yml', 'scripts/guardrails/index.ts', '.github/workflows/acceptance-wp002.yml', 'engine/io/github-transport.ts', 'engine/io/github-writer.ts', 'engine/io/wp002-integration.test.ts', 'engine/io/wp002-integration.ts']}
        def verify_r1(candidate):
         assert git('rev-parse',r1['base']+'^{tree}').strip()==r1['tree'],'R1-base-tree'
         git('merge-base','--is-ancestor',r1['base'],candidate)
         chain=git('rev-list','--reverse',r1['base']+'..'+candidate).splitlines();assert 2<=len(chain)<=4,'R1-count'
         previous=r1['base']
         for i,sha in enumerate(chain):
          assert git('rev-list','--parents','-n','1',sha).strip()==sha+' '+previous,'R1-parent'
          msg=git('show','-s','--format=%B',sha)
          for k,v in [('Grant','FS24-B-R1'),('Phase','policy' if i==0 else 'implementation')]+([] if i==0 else [('Iteration',str(i))]):assert re.findall(r'^Fulcrum-'+k+': (.*)$',msg,re.M)==[v],'R1-trailer'
          changed=set(git('diff','--name-only',previous,sha).splitlines())
          assert changed==set(r1['files']) if i==0 else changed<=set(r1['paths'][2:]),'R1-scope'
          previous=sha
         for path,pin in r1['files'].items():
          assert git('rev-parse',chain[0]+':'+path).strip()==pin and git('rev-parse',candidate+':'+path).strip()==pin,'R1-policy-freeze'
          assert git('show',chain[0]+':'+path).startswith(git('show',r1['base']+':'+path)),'R1-prefix'
         assert set(git('diff','--name-only',r1['base'],candidate).splitlines())<=set(r1['paths'])
         for path in git('ls-tree','-r','--name-only',r1['base']).splitlines():
          if path not in r1['paths']:assert git('ls-tree',r1['base'],'--',path)==git('ls-tree',candidate,'--',path),('R1-preservation',path)

        parents=git('rev-list','--parents','-n','1',head).split()
        assert len(parents)==3 and parents[1]==r1['base'],'R1-merge-parents'
        assert git('rev-parse',head+'^{tree}')==git('rev-parse',parents[2]+'^{tree}'),'R1-merge-tree'
        msg=git('show','-s','--format=%B',head)
        assert re.findall(r'^Fulcrum-Grant: (.*)$',msg,re.M)==['FS24-B-R1']
        assert re.findall(r'^Fulcrum-Phase: (.*)$',msg,re.M)==['diagnostic-bootstrap']
        numbers=re.findall(r'^Fulcrum-Repair-PR: ([1-9][0-9]*)$',msg,re.M);assert len(numbers)==1 and int(numbers[0])>12
        verify_r1(parents[2])
        e=pathlib.Path(os.environ['FS_EVIDENCE']);root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
        request=urllib.request.Request('https://api.github.com/repos/HungQuach301/fulcrum-studio/git/ref/heads/main',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
        with urllib.request.urlopen(request) as response:raw=response.read()
        (e/'main-ref.before.json').write_bytes(raw);assert json.loads(raw)['object']['sha']==head
        snapshot={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in git('ls-files').splitlines()}
        (e/'source.before.json').write_text(json.dumps(snapshot))
        print('FS24R1_STATIC_ADMISSION=pass')
        PY
    - name: Checksum-pinned runtime and exact lockfile
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz -o "$TASK_ROOT/node.tar.xz"
        printf '%s  %s
        ' df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d "$TASK_ROOT/node.tar.xz" | sha256sum -c -
        tar -xJf "$TASK_ROOT/node.tar.xz" -C "$TASK_ROOT"
        node_path="$TASK_ROOT/node-v20.20.2-linux-x64/bin/node"
        npm_cli="$TASK_ROOT/node-v20.20.2-linux-x64/lib/node_modules/npm/bin/npm-cli.js"
        test "$($node_path --version)" = v20.20.2
        test "$($node_path "$npm_cli" --version)" = 10.8.2
        mkdir "$TASK_ROOT/mirror"
        git archive "$FS_HEAD" | tar -x -C "$TASK_ROOT/mirror"
        export npm_config_cache="$TASK_ROOT/npm-cache"
        "$node_path" "$npm_cli" ci --prefix "$TASK_ROOT/mirror" --ignore-scripts --no-audit --no-fund --include=dev --include=optional
        printf 'FS_NODE=%s
        FS_TSX=%s/mirror/node_modules/tsx/dist/cli.mjs
        ' "$node_path" "$TASK_ROOT" >> "$GITHUB_ENV"
        printf 'FS24B_RUNTIME=node20.20.2;npm10.8.2;checksum=pass;Node20EOL=accepted-R1;Node24Patch=unproven;billing=unknown
        '
    - name: Diagnose historical and repair receipts
      id: diagnostic
      shell: bash
      run: |
        set -euo pipefail
        cd "$TASK_ROOT/mirror"
        "$FS_NODE" "$FS_TSX" engine/io/wp002-integration.ts diagnose-repair
    - name: Verify source mirror and live main unchanged
      id: preservation
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,pathlib,json,hashlib,subprocess,urllib.request
        e=pathlib.Path(os.environ['FS_EVIDENCE']);root=pathlib.Path(os.environ['GITHUB_WORKSPACE']);mirror=pathlib.Path(os.environ['TASK_ROOT'],'mirror')
        before=json.loads((e/'source.before.json').read_text());after={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in before}
        (e/'source.after.json').write_text(json.dumps(after,sort_keys=True)+'\n');assert before==after
        if mirror.exists():assert all(hashlib.sha256((mirror/p).read_bytes()).hexdigest()==v for p,v in before.items())
        assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()==os.environ['FS_HEAD']
        assert not subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all']).strip()
        request=urllib.request.Request('https://api.github.com/repos/HungQuach301/fulcrum-studio/git/ref/heads/main',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
        with urllib.request.urlopen(request) as response:raw=response.read()
        (e/'main-ref.after.json').write_bytes(raw);assert json.loads(raw)['object']['sha']==json.loads((e/'main-ref.before.json').read_text())['object']['sha']
        (e/'preservation.json').write_text(json.dumps({'result':'pass','sourceUnchanged':True,'mirrorUnchanged':mirror.exists(),'mainUnchanged':True,'sourceFiles':len(before),'stateAndDependencyBytesUnchanged':True})+'\n')
        PY
    - name: Cleanup and outcome evidence
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,json,pathlib,shutil,hashlib,base64
        p=pathlib.Path(os.environ['TASK_ROOT']);assert p.parent==pathlib.Path(os.environ['RUNNER_TEMP']) and p.name.startswith('fs24r1.')
        print('FS24R1_STEPS\t'+os.environ['FS24_STEPS'])
        for f in sorted((p/'evidence').glob('*')):
         if f.is_file():
          raw=f.read_bytes();meta={'grant':'FS24-B-R1','run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'head':os.environ['FS_HEAD'],'job':'diagnostic','name':f.name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          print('FS24B_FILE\t'+json.dumps(meta));encoded=base64.b64encode(raw).decode()
          for i in range(0,len(encoded),2048):print('FS24B_DATA\t'+str(i//2048+1)+'\t'+encoded[i:i+2048])
          print('FS24B_END\t'+f.name)
        shutil.rmtree(p);assert not p.exists()
        print('FS24R1_CLEANUP=pass')
        PY
      if: ${{ always() }}
      env:
        FS24_STEPS: ${{ toJSON(steps) }}
  diagnostic-report:
    needs:
    - diagnostic
    if: ${{ always() && github.event_name == 'workflow_run' && needs.diagnostic.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Report diagnostic result without activation
      env:
        RESULT: ${{ needs.diagnostic.result }}
      shell: bash
      run: |
        set -euo pipefail
        printf "FS24R1_DIAGNOSTIC=%s;activation=false\n" "$RESULT"
        test "$RESULT" = success
'on':
  push:
    branches:
    - wp/002
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
  workflow_run:
    workflows:
    - Fulcrum CI
    types:
    - completed
    branches:
    - main
