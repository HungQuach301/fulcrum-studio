name: FS24 Evidence Transfer
run-name: FS24F ${{ github.event.workflow_run.id || github.sha }}
on:
  push:
    branches: [wp/002]
  workflow_run:
    workflows: [Fulcrum CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: fs24f-${{ github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false
env:
  FS_HEAD: ${{ github.event.workflow_run.head_sha || github.sha }}
  GH_TOKEN: ${{ github.token }}
  FS_GRANT: FS24-D
  FS24_F_ACTIVE: 'true'
jobs:
  prepare:
    if: >-
      ${{
        github.repository == 'HungQuach301/fulcrum-studio' &&
        github.run_attempt == 1 &&
        (
          github.event_name == 'push' ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository
          )
        )
      }}
    runs-on: ubuntu-24.04
    env:
      FS_JOB: prepare
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      source_id: ${{ steps.plan.outputs.source_id }}
      source_name: ${{ steps.plan.outputs.source_name }}
      source_bytes: ${{ steps.plan.outputs.source_bytes }}
      source_sha256: ${{ steps.plan.outputs.source_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.FS_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Allocate isolated transfer files
        id: init
        shell: bash
        run: |
          set -euo pipefail
          task_dir="$(mktemp -d "$RUNNER_TEMP/fs24f.XXXXXX")"
          printf 'FS_TRANSFER_ROOT=%s\n' "$task_dir" >> "$GITHUB_ENV"
      - name: Verify volume codec and negative cases
        shell: bash
        run: |
          set -euo pipefail
          python3 engine/io/evidence-transfer.test.py
      - name: Bind authority ledger and phase
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 engine/io/evidence-transfer.py prepare-f --directory "$FS_TRANSFER_ROOT"
      - name: Upload deterministic qualification source
        id: source
        if: ${{ steps.prepare.outputs.mode == 'qualify' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.prepare.outputs.source_name }}
          path: ${{ env.FS_TRANSFER_ROOT }}/qualification-source.bin
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Pin source metadata and build root plan
        id: plan
        shell: bash
        env:
          FS_TRANSFER_MODE: ${{ steps.prepare.outputs.mode }}
          FS_SELECTED: ${{ steps.prepare.outputs.selected }}
          FS_SOURCE_ID: ${{ steps.source.outputs.artifact-id || '10459765118' }}
          FS_SOURCE_NAME: ${{ steps.prepare.outputs.source_name }}
          FS_SOURCE_DIGEST: ${{ steps.source.outputs.artifact-digest || 'sha256:a9379fb49992eb6554d15e8f60f7415265fcdaa481501439a204942a14eccd63' }}
        run: |
          set -euo pipefail
          python3 engine/io/evidence-transfer.py plan-f --directory "$FS_TRANSFER_ROOT"
      - name: Upload immutable root plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fs24f-plan-${{ github.run_id }}
          path: ${{ env.FS_TRANSFER_ROOT }}/root-plan.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Preserve bounded preparation receipts on failure
        if: ${{ failure() && steps.init.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fs24f-failure-${{ github.run_id }}-prepare
          path: |
            ${{ env.FS_TRANSFER_ROOT }}/*.json
            !${{ env.FS_TRANSFER_ROOT }}/qualification-source.bin
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
  emit:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      FS_JOB: emit-volume-${{ matrix.volume }}
      FS_TRANSFER_MODE: ${{ needs.prepare.outputs.mode }}
      FS_SOURCE_ID: ${{ needs.prepare.outputs.source_id }}
      FS_SOURCE_NAME: ${{ needs.prepare.outputs.source_name }}
      FS_SOURCE_DIGEST: sha256:${{ needs.prepare.outputs.source_sha256 }}
      FS_SOURCE_BYTES: ${{ needs.prepare.outputs.source_bytes }}
      FS_PLAN_HASH: ${{ needs.prepare.outputs.plan_hash }}
      FS_SELECTED: ${{ toJSON(fromJSON(needs.prepare.outputs.matrix).volume) }}
      FS_VOLUME: ${{ matrix.volume }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.FS_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Receive one exact HTTP range and emit its volume
        shell: bash
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d "$RUNNER_TEMP/fs24f-emit.XXXXXX")"
          printf 'FS_EMIT_ROOT=%s\n' "$work_dir" >> "$GITHUB_ENV"
          python3 engine/io/evidence-transfer.py emit-volume-f --directory "$work_dir"
      - name: Upload byte-free volume manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fs24f-volume-${{ github.run_id }}-${{ matrix.volume }}
          path: ${{ env.FS_EMIT_ROOT }}/volume-manifest.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Preserve bounded HTTP receipts on failure
        if: ${{ failure() && env.FS_EMIT_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fs24f-failure-${{ github.run_id }}-volume-${{ matrix.volume }}
          path: ${{ env.FS_EMIT_ROOT }}/*.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
  report:
    if: ${{ always() && needs.prepare.result != 'skipped' }}
    needs: [prepare, emit]
    runs-on: ubuntu-24.04
    env:
      FS_JOB: report
      PREPARE_RESULT: ${{ needs.prepare.result }}
      EMIT_RESULT: ${{ needs.emit.result }}
      FS_PLAN_HASH: ${{ needs.prepare.outputs.plan_hash }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.FS_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify small manifests and create the root manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$PREPARE_RESULT" = success
          report_dir="$(mktemp -d "$RUNNER_TEMP/fs24f-report.XXXXXX")"
          printf 'FS_REPORT_ROOT=%s\n' "$report_dir" >> "$GITHUB_ENV"
          python3 engine/io/evidence-transfer.py collect-root-f --directory "$report_dir"
      - name: Upload root manifest for independent consumer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fs24f-root-${{ github.run_id }}
          path: ${{ env.FS_REPORT_ROOT }}/root-manifest.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
