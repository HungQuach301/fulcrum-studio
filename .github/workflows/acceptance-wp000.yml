name: WP-000 bootstrap

# Offline L candidate only. Preparing this file does not authorize execution or spending.
# Updating wp/000 requires a separate owner grant for PR #10 synchronize, run 4 / attempt 1,
# Node 20.20.2 EOL, managed action Node 24 (patch unproven), and the proposed limits below.
# Historical run 34745712444 remains a failure; run 2 success prepared a lockfile only.
# Both run 3 jobs remain skipped, with no steps, runner or artifact.
# Before a future fast-forward: compare BOTH files with the approved offline bytes,
# then read the created commit/tree/sole parent. No candidate SHA is embedded here.
# State and acceptance routes have not been activated.
on:
  pull_request:
    branches: [main]
    types: [synchronize]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  check-lockfile-l:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.repository == 'HungQuach301/fulcrum-studio' &&
      github.event.pull_request.number == 10 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'wp/000' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == true &&
      github.run_number == 4 && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASELINE: a7fecd4f8a614d10687b471f70f71a5d5e08685f
      BASELINE_TREE: ddb16f67fbf246e669dc28fc50718de75a365f11
      SPEC_HEAD: 69e1ea78c51370d221edc9179dfd573340b63d5b
      L_PARENT: d149efe64b0ed33b73d57a6e806c61d2fa24b340
      L_PARENT_TREE: d415dabb0bcd5123af9dab5680cac301cb719956
      L_WORKFLOW_ID: '356972316'
      LOCKFILE_BYTES: '22948'
      LOCKFILE_SHA256: 28effb5a9d439ea02b39b3cc9ec8f49157b962534213bf3464f5edd19199ba97
      MANIFEST_SHA256: 448d897c27e4a664cbbbbefab0de4c9e7dde705e2bbc24b06dd8f67928e8f8e5
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_PR: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      EVENT_SHA: ${{ github.sha }}
      NODE_VERSION: 20.20.2
      NPM_VERSION: 10.8.2
      NODE_ARCHIVE_SHA256: df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d
      PROPOSED_BUDGET_USD: '0.05'
      ARTIFACT_MAX_BYTES: '1048576'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_FETCH_RETRIES: '0'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Initialize lockfile L receipt
        id: init
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_NUMBER" = 4
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(uname -m)" = x86_64
          task_root="$(mktemp -d "$RUNNER_TEMP/wp000-lockfile-l.XXXXXX")"
          trap 'init_status=$?; if [ "$init_status" -ne 0 ]; then rm -rf -- "$task_root"; fi' EXIT
          mkdir -p "$task_root/report" "$task_root/tools" "$task_root/manifest" "$task_root/cache"
          printf 'TASK_ROOT=%s\n' "$task_root" >> "$GITHUB_ENV"
          printf 'NPM_CONFIG_CACHE=%s/cache\n' "$task_root" >> "$GITHUB_ENV"
          {
            printf 'purpose=lockfile-L-install-and-tool-feasibility-only\n'
            printf 'event=%s\naction=%s\npullRequest=%s\n' "$GITHUB_EVENT_NAME" "$EVENT_ACTION" "$EVENT_PR"
            printf 'runId=%s\nrunNumber=%s\nattempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
            printf 'eventHead=%s\neventBase=%s\neventSha=%s\n' "$EVENT_HEAD" "$EVENT_BASE" "$EVENT_SHA"
            printf 'baseline=%s\nbaselineTree=%s\n' "$BASELINE" "$BASELINE_TREE"
            printf 'lParent=%s\nlParentTree=%s\npreviousFailedRun=34745712444\n' "$L_PARENT" "$L_PARENT_TREE"
            printf 'proposedBudgetUsd=%s\nnewGrantRequiredBeforeSynchronize=true\n' "$PROPOSED_BUDGET_USD"
            printf 'billedCostUsd=unknown\ninvoiceReconciled=false\napiZeroDoesNotProveZeroCost=true\n'
            printf 'statePreparation=not-activated\nacceptance=not-activated\nwp000Acceptance=blocked\n'
            printf 'npmCiInitial=not-run\nprojectTypecheck=not-run\nvalidator=not-run\nfullFixtures=not-run\n'
            printf 'minimalToolCaseInitial=not-run\nplatformTreeInitial=not-run\nlockfileAcceptance=not-established\n'
            printf 'lockfileBytes=%s\nlockfileSha256=%s\n' "$LOCKFILE_BYTES" "$LOCKFILE_SHA256"
            printf 'nodeEolException=requires-separate-current-grant\n'
            printf 'actionRuntime=managed-by-GitHub; Node24-override-possible\nnode24Patch=unproven\n'
            printf 'checkout=v4.3.1@34e114876b0b11c390a56381ad16ebd13914f8d5\n'
            printf 'setup-node=v4.4.0@49933ea5288caeca8642d1e84afbd3f7d6820020\n'
            printf 'upload-artifact=v4.6.2@ea165f8d65b6e75b540449e92b4886f43607fa02\n'
            printf 'startedAt=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'runnerOS=%s\nrunnerArch=%s\nimageVersion=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageVersion:-unproven}"
          } > "$task_root/report/ci-report.txt"

      - name: Checkout exact candidate head
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify source checkpoint and read live refs
        id: checkpoint
        shell: bash
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EVENT_HEAD" =~ ^[a-f0-9]{40}$ ]]
          observed_checkout_sha="$(git rev-parse HEAD)"
          observed_checkout_tree="$(git rev-parse HEAD^{tree})"
          observed_parent="$(git show -s --format=%P HEAD)"
          {
            printf 'observedCheckoutSha=%s\nobservedCheckoutTree=%s\nobservedParent=%s\n' "$observed_checkout_sha" "$observed_checkout_tree" "$observed_parent"
          } >> "$TASK_ROOT/report/ci-report.txt"
          test "$EVENT_BASE" = "$BASELINE"
          test "$observed_checkout_sha" = "$EVENT_HEAD"
          test "$(git rev-parse "$BASELINE^{tree}")" = "$BASELINE_TREE"
          test "$(git rev-parse "$SPEC_HEAD^{tree}")" = "$BASELINE_TREE"
          test "$observed_parent" = "$L_PARENT"
          test "$(git rev-parse "$L_PARENT^{tree}")" = "$L_PARENT_TREE"
          test "$(git show -s --format=%P "$L_PARENT")" = 21016357f0454b15dfd9e135b6db1501ddfc2386
          test "$(git rev-list --count "$BASELINE..HEAD")" = 5
          test "$(git diff --no-renames --name-status "$L_PARENT" HEAD)" = $'M\t.github/workflows/acceptance-wp000.yml\nM\tscripts/acceptance-wp000.ts'
          for path in .github/workflows/acceptance-wp000.yml scripts/acceptance-wp000.ts; do
            test "$(git ls-tree "$L_PARENT" -- "$path" | awk '{print $1}')" = 100644
            test "$(git ls-tree HEAD -- "$path" | awk '{print $1}')" = 100644
          done
          test "$(git ls-tree -r "$BASELINE" | wc -l)" -eq 108
          test "$(git ls-tree -r HEAD | wc -l)" -eq 123
          # The exact two-file delta preserves all other 121 parent blobs/modes.
          # No existing baseline blob or mode may change; additions belong to PR #10.
          git diff --exit-code --no-renames --diff-filter=MDTUXB "$BASELINE" HEAD
          git merge-base --is-ancestor "$SPEC_HEAD" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f package-lock.json
          test "$(wc -c < package-lock.json)" -eq "$LOCKFILE_BYTES"
          printf '%s  package-lock.json\n%s  package.json\n' "$LOCKFILE_SHA256" "$MANIFEST_SHA256" | sha256sum --check --strict
          git show "$L_PARENT:package-lock.json" > "$TASK_ROOT/lockfile.parent"
          cmp "$TASK_ROOT/lockfile.parent" package-lock.json
          test ! -e node_modules
          # jq is a preinstalled runner utility; never install or repair it if unavailable.
          jq --version >> "$TASK_ROOT/report/ci-report.txt"
          case "$GITHUB_WORKFLOW_REF" in "$GITHUB_REPOSITORY/.github/workflows/acceptance-wp000.yml@"*) ;; *) exit 1 ;; esac
          # Actual workflow ID and ZIP metadata are read back by the agent: the job token has no Actions permission.
          printf 'expectedWorkflowId=%s\nworkflowRef=%s\nactualWorkflowId=requires-API-readback\n' "$L_WORKFLOW_ID" "$GITHUB_WORKFLOW_REF" >> "$TASK_ROOT/report/ci-report.txt"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/10" > "$TASK_ROOT/pr.json"
          jq -e --arg head "$EVENT_HEAD" --arg base "$BASELINE" --arg repo "$GITHUB_REPOSITORY" \
            '.number == 10 and .state == "open" and .draft == true and .head.sha == $head and .head.ref == "wp/000" and .head.repo.full_name == $repo and .base.sha == $base and .base.ref == "main" and .base.repo.full_name == $repo and .commits == 5 and .changed_files == 15' "$TASK_ROOT/pr.json"
          jq '{number, state, draft, commits, changed_files, additions, deletions, head: {sha: .head.sha, ref: .head.ref}, base: {sha: .base.sha, ref: .base.ref}}' \
            "$TASK_ROOT/pr.json" > "$TASK_ROOT/report/pr-observed.json"
          # Read-only token in environment; no persisted checkout credentials or token in URL/logs.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          GIT_TERMINAL_PROMPT=0 timeout 30s git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main refs/heads/wp/000 > "$TASK_ROOT/live-refs.txt"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 READ_TOKEN
          test "$(awk '$2 == "refs/heads/main" {print $1}' "$TASK_ROOT/live-refs.txt")" = "$BASELINE"
          test "$(awk '$2 == "refs/heads/wp/000" {print $1}' "$TASK_ROOT/live-refs.txt")" = "$EVENT_HEAD"
          git ls-tree -r HEAD > "$TASK_ROOT/source-tree.before"
          git ls-files -z | xargs -0 sha256sum > "$TASK_ROOT/report/source-files.before.sha256"
          git diff --no-renames --name-status "$BASELINE" HEAD > "$TASK_ROOT/report/candidate-files.txt"
          {
            printf 'checkoutSha=%s\ncheckoutTree=%s\nparent=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git show -s --format=%P HEAD)"
            printf 'stateBlob=%s\n' "$(git rev-parse HEAD:pipeline/state.json)"
            printf 'checkpoint=pass\nlScope=pass\nlDeltaFiles=2\nlModes=100644\ncandidateCommitCount=5\npreservedParentFiles=121\npreservedBaselineFiles=108\n'
          } >> "$TASK_ROOT/report/ci-report.txt"

      - name: Fetch checksum-pinned Node archive into temporary storage
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive="node-v$NODE_VERSION-linux-x64.tar.xz"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 90 \
            "https://nodejs.org/dist/v$NODE_VERSION/$archive" -o "$TASK_ROOT/tools/$archive"
          printf '%s  %s\n' "$NODE_ARCHIVE_SHA256" "$TASK_ROOT/tools/$archive" | sha256sum --check --strict
          tar -xJf "$TASK_ROOT/tools/$archive" -C "$TASK_ROOT/tools" --no-same-owner
          printf 'VERIFIED_NODE_ROOT=%s/tools/node-v%s-linux-x64\n' "$TASK_ROOT" "$NODE_VERSION" >> "$GITHUB_ENV"
          printf 'nodeArchiveSha256=%s\narchiveChecksum=pass\n' "$NODE_ARCHIVE_SHA256" >> "$TASK_ROOT/report/ci-report.txt"

      - name: Set up required Node major using pinned action
        id: setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          check-latest: false

      - name: Verify exact helper tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$NODE_VERSION"
          test "$("$VERIFIED_NODE_ROOT/bin/node" --version)" = "v$NODE_VERSION"
          test "$("$VERIFIED_NODE_ROOT/bin/node" "$VERIFIED_NODE_ROOT/lib/node_modules/npm/bin/npm-cli.js" --version)" = "$NPM_VERSION"
          printf '%s/bin\n' "$VERIFIED_NODE_ROOT" >> "$GITHUB_PATH"
          {
            printf 'helperNode=%s\n' "$("$VERIFIED_NODE_ROOT/bin/node" --version)"
            printf 'helperNpm=%s\n' "$("$VERIFIED_NODE_ROOT/bin/node" "$VERIFIED_NODE_ROOT/lib/node_modules/npm/bin/npm-cli.js" --version)"
            printf 'tools=pass\n'
          } >> "$TASK_ROOT/report/ci-report.txt"

      - name: Install the existing pinned lockfile in temporary storage
        id: install
        shell: bash
        run: |
          set -euo pipefail
          cp package.json package-lock.json "$TASK_ROOT/manifest/"
          cmp package.json "$TASK_ROOT/manifest/package.json"
          cmp package-lock.json "$TASK_ROOT/manifest/package-lock.json"
          cd "$TASK_ROOT/manifest"
          # A single attempt; timeout/failure never enables scripts, rebuild or a reinstall.
          set +e
          timeout 100s "$VERIFIED_NODE_ROOT/bin/node" "$VERIFIED_NODE_ROOT/lib/node_modules/npm/bin/npm-cli.js" ci \
            --ignore-scripts --no-audit --no-fund --include=dev --include=optional \
            > "$TASK_ROOT/report/npm-ci.stdout.txt" 2> "$TASK_ROOT/report/npm-ci.stderr.txt"
          install_status=$?
          set -e
          printf 'npmCiExitCode=%s\n' "$install_status" >> "$TASK_ROOT/report/ci-report.txt"
          cmp package.json "$GITHUB_WORKSPACE/package.json"
          cmp package-lock.json "$GITHUB_WORKSPACE/package-lock.json"
          test "$install_status" -eq 0
          printf 'npmCi=pass\nlifecycleScripts=disabled\n' >> "$TASK_ROOT/report/ci-report.txt"

      - name: Check installed dependency tree and minimal local tools only
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$TASK_ROOT/manifest/node_modules"
          export TMPDIR="$TASK_ROOT/cache"
          export TSX_DISABLE_CACHE=1
          test -z "${ESBUILD_BINARY_PATH:-}"
          cd "$TASK_ROOT/manifest"
          # tsx and every imported dependency resolve from this local installation.
          # Importing the existing modules does not invoke their guarded CLI or Validator.run.
          "$VERIFIED_NODE_ROOT/bin/node" "$TASK_ROOT/manifest/node_modules/tsx/dist/cli.mjs" \
            "$GITHUB_WORKSPACE/scripts/acceptance-wp000.ts" --lockfile-l \
            > "$TASK_ROOT/report/helper.stdout.txt" 2> "$TASK_ROOT/report/helper.stderr.txt"

      - name: Read back source and live refs without changes
        id: preservation
        if: ${{ always() && steps.checkpoint.outcome == 'success' }}
        shell: bash
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git ls-tree -r HEAD > "$TASK_ROOT/source-tree.after"
          cmp "$TASK_ROOT/source-tree.before" "$TASK_ROOT/source-tree.after"
          test -f package-lock.json
          test "$(wc -c < package-lock.json)" -eq "$LOCKFILE_BYTES"
          printf '%s  package-lock.json\n%s  package.json\n' "$LOCKFILE_SHA256" "$MANIFEST_SHA256" | sha256sum --check --strict
          if [ -e "$TASK_ROOT/manifest/package.json" ]; then cmp package.json "$TASK_ROOT/manifest/package.json"; fi
          if [ -e "$TASK_ROOT/manifest/package-lock.json" ]; then cmp package-lock.json "$TASK_ROOT/manifest/package-lock.json"; fi
          git ls-files -z | xargs -0 sha256sum > "$TASK_ROOT/report/source-files.after.sha256"
          cmp "$TASK_ROOT/report/source-files.before.sha256" "$TASK_ROOT/report/source-files.after.sha256"
          test ! -e node_modules
          test "$(git rev-parse HEAD:pipeline/state.json)" = 6f6eb4493fb6173b19bf2af126bf0b0cd68c5593
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          GIT_TERMINAL_PROMPT=0 timeout 30s git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main refs/heads/wp/000 > "$TASK_ROOT/live-refs.after"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 READ_TOKEN
          cmp "$TASK_ROOT/live-refs.txt" "$TASK_ROOT/live-refs.after"
          printf 'sourceUnchanged=true\nliveRefsUnchanged=true\n' >> "$TASK_ROOT/report/ci-report.txt"

      - name: Clean temporary installation and tool data even after failure
        id: cleanup
        if: ${{ always() && steps.init.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK_ROOT" in "$RUNNER_TEMP"/wp000-lockfile-l.*) ;; *) exit 1 ;; esac
          rm -rf -- "$TASK_ROOT/manifest" "$TASK_ROOT/tools" "$TASK_ROOT/cache" "$TASK_ROOT/smoke"
          for path in manifest tools cache smoke; do test ! -e "$TASK_ROOT/$path"; done
          printf 'temporaryInstallCleanup=pass\n' >> "$TASK_ROOT/report/ci-report.txt"

      - name: Finalize bounded lockfile L report
        id: report
        if: ${{ always() && steps.init.outcome == 'success' }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CHECKPOINT_OUTCOME: ${{ steps.checkpoint.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LOCKFILE_OUTCOME: ${{ steps.lockfile.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          PRESERVATION_OUTCOME: ${{ steps.preservation.outcome }}
        run: |
          set -euo pipefail
          {
            printf 'jobStatusBeforeUpload=%s\ncheckoutOutcome=%s\ncheckpointOutcome=%s\n' "$JOB_STATUS" "$CHECKOUT_OUTCOME" "$CHECKPOINT_OUTCOME"
            printf 'archiveOutcome=%s\nsetupOutcome=%s\ntoolsOutcome=%s\n' "$ARCHIVE_OUTCOME" "$SETUP_OUTCOME" "$TOOLS_OUTCOME"
            printf 'npmCiStepOutcome=%s\nlCheckOutcome=%s\npreservationOutcome=%s\ncleanupOutcome=%s\n' "$INSTALL_OUTCOME" "$LOCKFILE_OUTCOME" "$PRESERVATION_OUTCOME" "$CLEANUP_OUTCOME"
            printf 'state-current=not-validated\nstateBaseline=known-invalid\nstateValidation=not-run\nrealDataAllValid=false\nwp000Acceptance=blocked\n'
            printf 'ciSpecPR9Acceptance=separate-historical-evidence-only\n'
            printf 'lockfileAcceptance=requires-exact-run-readback-and-owner-review\nprojectTypecheck=not-run\nvalidator=not-run\nfullFixtures=not-run\n'
            printf 'companionSpecExpected=356875747;run4;attempt1;skipped;readback-required\n'
            printf 'recoveryDeviationMs=301132;unwaived\nlateSaveStartMs=19288;lateResponseMs=25607;unwaived\n'
            printf 'historicalRun3CompletedBeforeStartedSeconds=1;unmodified;no-runtime-or-cost-inference\n'
            printf 'finishedAt=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$TASK_ROOT/report/ci-report.txt"
          cat "$TASK_ROOT/report/ci-report.txt"
          bytes="$(find "$TASK_ROOT/report" -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')"
          printf 'artifactUncompressedBytesBeforeSizeField=%s\n' "$bytes"
          # Reserve archive-header headroom; the uploaded artifact's actual size still needs API read-back.
          test "$bytes" -le "$((ARTIFACT_MAX_BYTES - 65536))"
          printf 'artifactUncompressedBytesBeforeSizeField=%s\n' "$bytes" >> "$TASK_ROOT/report/ci-report.txt"
          # A bounded file inventory is part of the artifact, excluding its own digest.
          (cd "$TASK_ROOT/report" && find . -type f ! -name artifact-files.sha256 -print0 | sort -z | xargs -0 sha256sum) > "$TASK_ROOT/report/artifact-files.sha256"
          test "$(find "$TASK_ROOT/report" -type f | wc -l)" -le 32
          final_bytes="$(find "$TASK_ROOT/report" -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')"
          printf 'artifactUncompressedBytesFinal=%s\n' "$final_bytes"
          test "$final_bytes" -le "$((ARTIFACT_MAX_BYTES - 65536))"
          printf 'artifactReady=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload one bounded lockfile L artifact
        id: upload
        if: ${{ always() && steps.report.outputs.artifactReady == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp000-lockfile-l-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.TASK_ROOT }}/report/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          overwrite: false

      - name: Final evidence and cleanup
        if: ${{ always() && steps.init.outcome == 'success' }}
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          printf 'uploadOutcome=%s\nartifactId=%s\nartifactDigest=%s\n' "$UPLOAD_OUTCOME" "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
          printf 'artifactMetadataAndBilledCost=requires-read-back; missing evidence blocks the next phase\n'
          case "$TASK_ROOT" in "$RUNNER_TEMP"/wp000-lockfile-l.*) rm -rf -- "$TASK_ROOT" ;; *) exit 1 ;; esac
          test "$UPLOAD_OUTCOME" = success

# No state/acceptance job, automatic write, provider secret, cache, dispatch execution or retry loop.
# A failed/skipped/cancelled run, missing receipt, changed checkpoint or exceeded limit stops progression.
# Final run/job status, action runtime warnings, artifact size/expiry and billing evidence are read back
# from GitHub separately, including BOTH ZIP and extracted byte limits. This report cannot certify
# its own future upload, cleanup after upload, companion skipped run, Node 24 patch or invoice.
# Historical runtime exceptions and budgets are closed; preparing this file grants none.
