name: WP-000 bootstrap

# Offline acceptance candidate only. No execution, budget or Node exception is granted here.
# Owner accepted L, state artifact generation and exact-byte state admission at parent 932a10f.
# Preserve B1/B2, unknown billing, Node20 EOL/Node24 patch uncertainty and every historical STOP/error.
# Execution requires owner approval of FS22; each new commit consumes one grant slot.
# Before each FF: verify the approved delta, created tree, sole parent and grant ledger.
# The event head is the future reviewed commit; no self-referential SHA is embedded in this workflow.
on:
  pull_request:
    branches: [main]
    types: [synchronize]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  acceptance:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
      github.repository == 'HungQuach301/fulcrum-studio' &&
      github.event.pull_request.number == 10 && github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'wp/000' && github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.title, '[FS22-20260914:acceptance]') && github.run_attempt == 1
    runs-on: ubuntu-24.04
    # No project-imposed job deadline; the Actions platform limit still applies.
    env:
      FS_GRANT: FS22-20260914
      FS_PHASE: acceptance
      FS_START: 900833d041486643540ea794bbe0bbad80f557bb
      FS_START_TREE: 12564c79d2cae7437d021e81f6bec6301e76c629
      FS_MAIN: a7fecd4f8a614d10687b471f70f71a5d5e08685f
      FS_MAIN_TREE: ddb16f67fbf246e669dc28fc50718de75a365f11
      FS_HEAD: ${{ github.event.pull_request.head.sha }}
      FS_SPEC_COMMIT: '03e4a405362ef8893d0193a45a6ff40c07c7f902'
      FS_SPEC_RUN: '34863629511'
      BASELINE: a7fecd4f8a614d10687b471f70f71a5d5e08685f
      BASELINE_TREE: ddb16f67fbf246e669dc28fc50718de75a365f11
      STATE_SOURCE_COMMIT: f7e959f95de470e2d6bef461e17b42c3218ec74f
      STATE_SOURCE_TREE: 5aec8c4556e2905e67729e7553d1f36d70d1a8c2
      STATE_BLOB: aa4b01b8d13db6dbff451a1404d5e5464369bc62
      STATE_SHA256: 09f87b64bd8f057067789067f546bc3e5954abd47db2ff56e0fe1a0bee36e024
      LOCKFILE_BYTES: '22948'
      LOCKFILE_SHA256: 28effb5a9d439ea02b39b3cc9ec8f49157b962534213bf3464f5edd19199ba97
      MANIFEST_SHA256: 448d897c27e4a664cbbbbefab0de4c9e7dde705e2bbc24b06dd8f67928e8f8e5
      NODE_VERSION: 20.20.2
      NPM_VERSION: 10.8.2
      NODE_ARCHIVE_SHA256: df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_PR: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      WP000_ACCEPTANCE_COMMIT: ${{ github.event.pull_request.head.sha }}
      PROPOSED_BUDGET_USD: '20.00'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_FETCH_RETRIES: '0'
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Initialize bounded acceptance receipt
        id: init
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(uname -m)" = x86_64
          task_root="$(mktemp -d "$RUNNER_TEMP/wp000-acceptance.XXXXXX")"
          trap 's=$?; if [ "$s" -ne 0 ]; then rm -rf -- "$task_root"; fi' EXIT
          mkdir -p "$task_root/report" "$task_root/manifest" "$task_root/tools" "$task_root/cache"
          printf 'TASK_ROOT=%s\nNPM_CONFIG_CACHE=%s/cache\n' "$task_root" "$task_root" >> "$GITHUB_ENV"
          {
            printf 'purpose=wp000-acceptance-candidate\nrunId=%s\nrunNumber=%s\nattempt=1\nexpectedWorkflow=356972316\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER"
            printf 'companionExpected=356875747;phase-exclusive;API-readback-required\n'
            printf 'eventSha=%s\nhead=%s\nbaseline=%s\ngrantStart=%s\n' "$GITHUB_SHA" "$EVENT_HEAD" "$BASELINE" "$FS_START"
            printf 'packageBudgetProposedUsd=20.00;owner-grant-required\nprojectJobDeadline=none\nprojectTaskDeadline=none;platform-limits-still-apply\n'
            printf 'B1B2=unverified;no-policy-or-quota-change\nbilledCostUsd=unknown\ninvoiceReconciled=false\n'
            printf 'node20EolException=FS22-package-only-when-owner-approved\nactionNode24Patch=unproven\n'
            printf 'history=all-input-STOPs-failures-and-errors-retained\nrecoveryDeviationMs=301132\nlateSaveStartMs=19288\nlateResponseMs=25607\n'
            printf 'historicalSkippedRun3Run4Run5TimestampInversions=unwaived\nLArtifactExpiryOffsetSeconds=-1\n'
            printf 'run5StandaloneLogExtraLF=unwaived;rawJSON-retained\nadmissionReceiptParserSTOP=retained\n'
            printf 'stateGeneration=not-invoked\nstateAdmission=owner-accepted-before-grant-C\nbacklogDone=proposal-only\nwp000Acceptance=pending\n'
            printf 'checkout=v4.3.1@34e114876b0b11c390a56381ad16ebd13914f8d5\nsetup-node=v4.4.0@49933ea5288caeca8642d1e84afbd3f7d6820020\nhistorical-upload-artifact-not-invoked=v4.6.2@ea165f8d65b6e75b540449e92b4886f43607fa02\n'
            printf 'startedAt=%s\nrunnerOS=%s\nrunnerArch=%s\nimageVersion=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageVersion:-unproven}"
          } > "$task_root/report/ci-report.txt"

      - name: Checkout exact candidate head
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify package grant and specification evidence
        id: checkpoint
        shell: bash
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FS_REPORT="$TASK_ROOT/report"

          set -euo pipefail
          test "$GITHUB_REPOSITORY" = HungQuach301/fulcrum-studio
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_RUN_ATTEMPT" = 1
          jq -e --arg h "$FS_HEAD" --arg b "$FS_MAIN" --arg title "[$FS_GRANT:$FS_PHASE]" '
            .action == "synchronize" and .pull_request.number == 10 and .pull_request.draft == true and
            .pull_request.head.repo.full_name == "HungQuach301/fulcrum-studio" and
            .pull_request.base.repo.full_name == "HungQuach301/fulcrum-studio" and
            .pull_request.head.ref == "wp/000" and .pull_request.base.ref == "main" and
            .pull_request.head.sha == $h and .pull_request.base.sha == $b and
            (.pull_request.title | startswith($title))' "$GITHUB_EVENT_PATH" >/dev/null
          test "$(git rev-parse HEAD)" = "$FS_HEAD"
          test "$(git rev-parse "$FS_MAIN^{tree}")" = "$FS_MAIN_TREE"
          test "$(git rev-parse "$FS_START^{tree}")" = "$FS_START_TREE"
          git merge-base --is-ancestor "$FS_START" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          allowed=(AGENTS.md engine/ops/guardrails.md engine/docs/02-decisions.md engine/ops/work-packages/WP-000-scaffold.md engine/ops/definition-of-done.md .github/workflows/acceptance-wp000.yml scripts/acceptance-wp000.ts .github/workflows/review-wp000-spec.yml)
          mapfile -t lineage < <(git rev-list --reverse "$FS_START..HEAD")
          test "${#lineage[@]}" -ge 1
          test "${#lineage[@]}" -le 3
          previous="$FS_START"
          slot=0
          for revision in "${lineage[@]}"; do
            slot=$((slot+1))
            test "$(git show -s --format=%P "$revision")" = "$previous"
            message="$(git show -s --format=%B "$revision")"
            test "$(printf '%s\n' "$message" | grep -cx "Fulcrum-Grant: $FS_GRANT")" -eq 1
            test "$(printf '%s\n' "$message" | grep -cx "Fulcrum-Slot: $slot")" -eq 1
            test "$(printf '%s\n' "$message" | grep -Ec '^Fulcrum-Phase: (spec|acceptance)$')" -eq 1
            test "$(printf '%s\n' "$message" | grep -c '^Fulcrum-Grant:')" -eq 1
            test "$(printf '%s\n' "$message" | grep -c '^Fulcrum-Slot:')" -eq 1
            test "$(printf '%s\n' "$message" | grep -c '^Fulcrum-Phase:')" -eq 1
            while IFS= read -r -d '' file; do
              permitted=false
              for a in "${allowed[@]}"; do if test "$file" = "$a"; then permitted=true; fi; done
              test "$permitted" = true
              test "$(git ls-tree "$revision" -- "$file" | awk '{print $1 " " $2}')" = '100644 blob'
            done < <(git diff --no-renames --name-only -z "$previous" "$revision")
            previous="$revision"
          done
          test "$(printf '%s\n' "$message" | grep -cx "Fulcrum-Phase: $FS_PHASE")" -eq 1
          test "$(git ls-tree -r HEAD | wc -l)" -eq 123
          # Unlisted files, including dependency manifests, state, backlog and contracts, retain C bytes/modes.
          exclude=()
          for a in "${allowed[@]}"; do exclude+=(":(exclude)$a"); done
          git diff --exit-code "$FS_START" HEAD -- . "${exclude[@]}"
          for a in "${allowed[@]}"; do
            test "$(git ls-tree HEAD -- "$a" | awk '{print $1 " " $2}')" = '100644 blob'
          done
          auth="$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          refs="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" GIT_TERMINAL_PROMPT=0 git ls-remote --refs https://github.com/HungQuach301/fulcrum-studio.git refs/heads/main refs/heads/wp/000)"
          unset auth
          test "$(printf '%s\n' "$refs" | awk '$2=="refs/heads/main" {print $1}')" = "$FS_MAIN"
          test "$(printf '%s\n' "$refs" | awk '$2=="refs/heads/wp/000" {print $1}')" = "$FS_HEAD"
          printf 'grant=%s\nphase=%s\nslot=%s\ncheckoutSha=%s\ncheckoutTree=%s\nrunId=%s\nattempt=%s\n' "$FS_GRANT" "$FS_PHASE" "$slot" "$FS_HEAD" "$(git rev-parse HEAD^{tree})" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$FS_REPORT/ci-report.txt"
          printf 'FS_SLOT=%s\n' "$slot" >> "$GITHUB_ENV"

          [[ "$FS_SPEC_COMMIT" =~ ^[0-9a-f]{40}$ ]] && test "$FS_SPEC_COMMIT" != 0000000000000000000000000000000000000000
          [[ "$FS_SPEC_RUN" =~ ^[1-9][0-9]*$ ]]
          git merge-base --is-ancestor "$FS_SPEC_COMMIT" HEAD^
          git show "$FS_SPEC_COMMIT:engine/docs/02-decisions.md" | grep '^## D-22 ' >/dev/null
          git show -s --format=%B "$FS_SPEC_COMMIT" | grep -qx 'Fulcrum-Phase: spec'
          # The approved policy and specification workflow cannot change after their successful spec run.
          git diff --exit-code "$FS_SPEC_COMMIT" HEAD -- AGENTS.md engine/ops/guardrails.md engine/docs/02-decisions.md engine/ops/work-packages/WP-000-scaffold.md engine/ops/definition-of-done.md .github/workflows/review-wp000-spec.yml
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --retry 0 \
            -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$FS_SPEC_RUN" > "$TASK_ROOT/report/spec-run.json"
          jq -e --arg h "$FS_SPEC_COMMIT" --argjson id "$FS_SPEC_RUN" '
            .id == $id and .workflow_id == 356875747 and .head_sha == $h and .event == "pull_request" and
            .run_attempt == 1 and .status == "completed" and .conclusion == "success" and
            .head_repository.full_name == "HungQuach301/fulcrum-studio" and
            any(.pull_requests[]; .number == 10)' "$TASK_ROOT/report/spec-run.json" >/dev/null
          printf 'specificationCommit=%s\nspecificationRun=%s\n' "$FS_SPEC_COMMIT" "$FS_SPEC_RUN" >> "$TASK_ROOT/report/ci-report.txt"
          test ! -e node_modules
          test "$(git rev-parse HEAD:pipeline/state.json)" = "$STATE_BLOB"
          test "$(wc -c < pipeline/state.json)" -eq 306
          test "$(wc -c < package-lock.json)" -eq "$LOCKFILE_BYTES"
          printf '%s  pipeline/state.json\n%s  package-lock.json\n%s  package.json\n' "$STATE_SHA256" "$LOCKFILE_SHA256" "$MANIFEST_SHA256" | sha256sum --check --strict
          git show "$FS_START:package-lock.json" > "$TASK_ROOT/lockfile.parent"
          cmp "$TASK_ROOT/lockfile.parent" package-lock.json
          test -z "$(git ls-tree -r --name-only HEAD | awk '/^episodes\/[^/]+\/[^/]+\/state\.json$/ {print}')"
          jq -e --arg s "$STATE_SOURCE_COMMIT" '.sourceCommit == $s and .rebuiltAt == "2026-09-14T01:24:30.332Z" and .episodes == []' pipeline/state.json
          printf 'ACCEPTANCE_SOURCE_TREE=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          case "$GITHUB_WORKFLOW_REF" in "$GITHUB_REPOSITORY/.github/workflows/acceptance-wp000.yml@"*) ;; *) exit 1 ;; esac
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/10" > "$TASK_ROOT/pr.json"
          jq -e --arg h "$EVENT_HEAD" --arg b "$BASELINE" '.number == 10 and .state == "open" and .draft == true and .head.sha == $h and .base.sha == $b and .head.ref == "wp/000" and .base.ref == "main" and .head.repo.full_name == "HungQuach301/fulcrum-studio" and .base.repo.full_name == "HungQuach301/fulcrum-studio"' "$TASK_ROOT/pr.json"
          jq '{number,state,draft,commits,changed_files,additions,deletions,head:{sha:.head.sha,ref:.head.ref},base:{sha:.base.sha,ref:.base.ref}}' "$TASK_ROOT/pr.json" > "$TASK_ROOT/report/pr-observed.json"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          GIT_TERMINAL_PROMPT=0 git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main refs/heads/wp/000 > "$TASK_ROOT/live-refs.txt"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 READ_TOKEN
          test "$(awk '$2 == "refs/heads/main" {print $1}' "$TASK_ROOT/live-refs.txt")" = "$BASELINE"
          test "$(awk '$2 == "refs/heads/wp/000" {print $1}' "$TASK_ROOT/live-refs.txt")" = "$EVENT_HEAD"
          git ls-tree -r HEAD > "$TASK_ROOT/source-tree.before"
          git ls-files -z | xargs -0 sha256sum > "$TASK_ROOT/report/source-files.before.sha256"
          git diff --no-renames --name-status "$BASELINE" HEAD > "$TASK_ROOT/report/candidate-files.txt"
          printf 'checkoutSha=%s\ncheckoutTree=%s\ncheckpoint=pass\nscope=FS22-eight-files\noutsideScope=unchanged-from-C\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" >> "$TASK_ROOT/report/ci-report.txt"

      - name: Fetch checksum-pinned Node archive into temporary storage
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive="node-v$NODE_VERSION-linux-x64.tar.xz"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            "https://nodejs.org/dist/v$NODE_VERSION/$archive" -o "$TASK_ROOT/tools/$archive"
          printf '%s  %s\n' "$NODE_ARCHIVE_SHA256" "$TASK_ROOT/tools/$archive" | sha256sum --check --strict
          tar -xJf "$TASK_ROOT/tools/$archive" -C "$TASK_ROOT/tools" --no-same-owner
          printf 'VERIFIED_NODE_ROOT=%s/tools/node-v%s-linux-x64\n' "$TASK_ROOT" "$NODE_VERSION" >> "$GITHUB_ENV"
          printf 'nodeArchiveSha256=%s\narchiveChecksum=pass\n' "$NODE_ARCHIVE_SHA256" >> "$TASK_ROOT/report/ci-report.txt"

      - name: Set up required Node major using pinned action
        id: setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          check-latest: false

      - name: Verify exact helper tools
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$NODE_VERSION"
          test "$("$VERIFIED_NODE_ROOT/bin/node" --version)" = "v$NODE_VERSION"
          test "$("$VERIFIED_NODE_ROOT/bin/node" "$VERIFIED_NODE_ROOT/lib/node_modules/npm/bin/npm-cli.js" --version)" = "$NPM_VERSION"
          printf '%s/bin\n' "$VERIFIED_NODE_ROOT" >> "$GITHUB_PATH"
          {
            printf 'helperNode=%s\n' "$("$VERIFIED_NODE_ROOT/bin/node" --version)"
            printf 'helperNpm=%s\n' "$("$VERIFIED_NODE_ROOT/bin/node" "$VERIFIED_NODE_ROOT/lib/node_modules/npm/bin/npm-cli.js" --version)"
            printf 'tools=pass\n'
          } >> "$TASK_ROOT/report/ci-report.txt"

      - name: Copy exact source and install once outside the checkout
        id: install
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            mkdir -p "$TASK_ROOT/manifest/$(dirname "$path")"
            cp -- "$path" "$TASK_ROOT/manifest/$path"
            cmp -- "$path" "$TASK_ROOT/manifest/$path"
          done < <(git ls-files -z)
          cd "$TASK_ROOT/manifest"
          sha256sum --check --strict "$TASK_ROOT/report/source-files.before.sha256"
          set +e
          "$VERIFIED_NODE_ROOT/bin/node" "$VERIFIED_NODE_ROOT/lib/node_modules/npm/bin/npm-cli.js" ci \
            --ignore-scripts --no-audit --no-fund --include=dev --include=optional \
            > "$TASK_ROOT/report/npm-ci.stdout.txt" 2> "$TASK_ROOT/report/npm-ci.stderr.txt"
          install_status=$?
          set -e
          printf 'npmCiExitCode=%s\n' "$install_status" >> "$TASK_ROOT/report/ci-report.txt"
          cmp package.json "$GITHUB_WORKSPACE/package.json"
          cmp package-lock.json "$GITHUB_WORKSPACE/package-lock.json"
          test "$install_status" -eq 0
          printf 'npmCi=pass\nlifecycleScripts=disabled\n' >> "$TASK_ROOT/report/ci-report.txt"

      - name: Validate real source tooling fixtures and guardrails
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$TASK_ROOT/manifest/node_modules" TMPDIR="$TASK_ROOT/cache" TSX_DISABLE_CACHE=1
          test -z "${ESBUILD_BINARY_PATH:-}"
          cd "$GITHUB_WORKSPACE"
          "$VERIFIED_NODE_ROOT/bin/node" "$TASK_ROOT/manifest/node_modules/tsx/dist/cli.mjs" \
            scripts/acceptance-wp000.ts --acceptance > "$TASK_ROOT/report/helper.stdout.txt" 2> "$TASK_ROOT/report/helper.stderr.txt"
          # Tools and harness each have a separate JSON file; raw stdout can contain both documents.
          jq -e '.result == "pass" and .installedTree == "pass" and .npmLs == "pass"' "$TASK_ROOT/report/acceptance-tools-receipt.json"
          jq -e --arg h "$EVENT_HEAD" --arg t "$ACCEPTANCE_SOURCE_TREE" \
            '.harnessResult == "pass" and .sourceCommit == $h and .sourceTree == $t and .sourceUnchanged == true and .fixtureCleanup == "pass" and .sourceAndMirrorByteFiles == 123 and .typecheck == "pass" and .logDryRun == "pass"' "$TASK_ROOT/report/acceptance-receipt.json"

      - name: Verify original source mirror pins and live refs after checks
        id: preservation
        if: ${{ always() && steps.checkpoint.outcome == 'success' }}
        shell: bash
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e node_modules
          git ls-tree -r HEAD > "$TASK_ROOT/source-tree.after"
          cmp "$TASK_ROOT/source-tree.before" "$TASK_ROOT/source-tree.after"
          git ls-files -z | xargs -0 sha256sum > "$TASK_ROOT/report/source-files.after.sha256"
          cmp "$TASK_ROOT/report/source-files.before.sha256" "$TASK_ROOT/report/source-files.after.sha256"
          printf '%s  pipeline/state.json\n%s  package-lock.json\n%s  package.json\n' "$STATE_SHA256" "$LOCKFILE_SHA256" "$MANIFEST_SHA256" | sha256sum --check --strict
          test "$(git rev-parse HEAD:pipeline/state.json)" = "$STATE_BLOB"
          if [ -f "$TASK_ROOT/manifest/package.json" ]; then
            (cd "$TASK_ROOT/manifest" && sha256sum --check --strict "$TASK_ROOT/report/source-files.before.sha256")
          fi
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          GIT_TERMINAL_PROMPT=0 git ls-remote --refs "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main refs/heads/wp/000 > "$TASK_ROOT/live-refs.after"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 READ_TOKEN
          cmp "$TASK_ROOT/live-refs.txt" "$TASK_ROOT/live-refs.after"
          printf 'sourceUnchanged=true\nmanifestAndLockUnchanged=true\nstateUnchanged=true\nliveRefsUnchanged=true\n' >> "$TASK_ROOT/report/ci-report.txt"

      - name: Clean all temporary execution data even after failure
        id: cleanup
        if: ${{ always() && steps.init.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK_ROOT" in "$RUNNER_TEMP"/wp000-acceptance.*) ;; *) exit 1 ;; esac
          find "$TASK_ROOT" -mindepth 1 -maxdepth 1 ! -name report -exec rm -rf -- {} +
          test "$(find "$TASK_ROOT" -mindepth 1 -maxdepth 1 ! -name report | wc -l)" -eq 0
          printf 'temporaryInstallMirrorToolsFixturesCacheCleanup=pass\n' >> "$TASK_ROOT/report/ci-report.txt"

      - name: Finalize complete bounded report
        id: report
        if: ${{ always() && steps.init.outcome == 'success' }}
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CHECKPOINT_OUTCOME: ${{ steps.checkpoint.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          PRESERVATION_OUTCOME: ${{ steps.preservation.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          verdict=pass
          for key in CHECKOUT_OUTCOME CHECKPOINT_OUTCOME ARCHIVE_OUTCOME SETUP_OUTCOME TOOLS_OUTCOME INSTALL_OUTCOME ACCEPTANCE_OUTCOME PRESERVATION_OUTCOME CLEANUP_OUTCOME; do
            printf '%s=%s\n' "$key" "${!key}" >> "$TASK_ROOT/report/ci-report.txt"
            if [ "${!key}" != success ]; then verdict=fail; fi
          done
          {
            printf 'preUploadTechnicalResult=%s\n' "$verdict"
            printf 'finalAcceptance=requires-complete-framed-evidence-run-final-cleanup-and-owner-review\nbacklogDone=proposal-only\n'
            printf 'costActualUsd=unknown\nnoMergeOrProviderAuthorization=true\n'
            printf 'finishedBeforeUploadAt=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$TASK_ROOT/report/ci-report.txt"
          cat "$TASK_ROOT/report/ci-report.txt"
          test "$verdict" = pass

      - name: Emit complete evidence bytes through job logs
        id: evidence
        if: ${{ always() && steps.init.outcome == 'success' }}
        shell: bash
        run: |
          FS_REPORT="$TASK_ROOT/report"

          set -euo pipefail
          test -d "$FS_REPORT"
          printf 'FS22_BEGIN\t%s\t%s\t%s\t%s\n' "$FS_GRANT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$FS_HEAD"
          count=0
          while IFS= read -r -d '' file; do
            test -f "$file" && test ! -L "$file"
            name="${file#"$FS_REPORT"/}"
            encoded="$(printf '%s' "$name" | base64 -w0)"
            bytes="$(wc -c < "$file")"
            digest="$(sha256sum "$file" | awk '{print $1}')"
            printf 'FS22_FILE\t%s\t%s\t%s\n' "$encoded" "$bytes" "$digest"
            base64 -w 2048 "$file" | awk '{printf "FS22_DATA\t%d\t%s\n", NR, $0}'
            printf 'FS22_END\t%s\n' "$encoded"
            count=$((count+1))
          done < <(find "$FS_REPORT" -type f -print0 | sort -z)
          printf 'FS22_COMPLETE\t%s\n' "$count"

      - name: Remove remaining report data
        if: ${{ always() && steps.init.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TASK_ROOT" in "$RUNNER_TEMP"/wp000-acceptance.*) rm -rf -- "$TASK_ROOT" ;; *) exit 1 ;; esac
          test ! -e "$TASK_ROOT"
          printf 'finalTemporaryCleanup=pass\n'

# Interrupted finalizers or incomplete framed evidence never establish acceptance.
